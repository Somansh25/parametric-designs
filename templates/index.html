<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Parametric Mathematical Canvas</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Canvas Container Surface -->
    <main class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </main>

    <!-- Mobile-First Bottom Sheet Control Panel -->
    <div id="controlPanel" class="control-panel">
        <!-- Touch Handle Bar for Swiping / Tapping -->
        <div id="sheetHandleBar" class="sheet-handle-bar">
            <div class="sheet-handle"></div>
        </div>

        <div class="panel-header">
            <h2>Parametric Design</h2>
            <div class="header-actions">
                <button id="shareBtn" class="icon-btn" title="Share Creation">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button id="zenBtn" class="icon-btn" title="Toggle Panel (Shortcut: H)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="panel-scroll-content">
            <div class="control-grid">
                <div class="input-group">
                    <label for="textInput">Custom Message</label>
                    <input type="text" id="textInput" value="I love you" placeholder="Enter text..." maxlength="30">
                </div>

                <div class="input-group">
                    <label for="shapeSelect">Curve Shape</label>
                    <select id="shapeSelect">
                        <option value="heart" selected>Heart</option>
                        <option value="infinity">Infinity</option>
                        <option value="astroid">Star</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="themeSelect">Visual Theme</label>
                    <select id="themeSelect">
                        <option value="neonPink" selected>Neon Pink</option>
                        <option value="cyberGold">Cyberpunk Gold</option>
                        <option value="deepSea">Deep Sea Blue</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="speedSlider">Animation Speed</label>
                    <input type="range" id="speedSlider" min="1" max="20" value="1">
                </div>

                <div class="input-group">
                    <label for="scaleSlider">Global Scale</label>
                    <input type="range" id="scaleSlider" min="5" max="20" value="10" step="0.5">
                </div>
            </div>

            <div class="action-bar">
                <button id="playPauseBtn" class="btn btn-primary">Pause</button>
                <button id="resetBtn" class="btn btn-secondary">Re-animate</button>
                <button id="exportPngBtn" class="btn btn-outline">Save PNG</button>
                <button id="recordWebmBtn" class="btn btn-outline">Record WebM</button>
            </div>

            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
